<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixelarte — Gráfico para Crochê e Macramê</title>

<style>
:root{
  --bg:#f5f1e8;
  --card:#fffdf8;
  --ink:#25231f;
  --muted:#746f66;
  --accent:#c86f52;
  --line:#ded7ca;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
}

.wrap{
  max-width:1200px;
  margin:auto;
  padding:28px 20px 50px;
}

header{
  margin-bottom:22px;
}

h1{
  margin:0 0 5px;
  font-size:32px;
}

header p{
  margin:0;
  color:var(--muted);
}

.layout{
  display:grid;
  grid-template-columns:320px 1fr;
  gap:20px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  box-shadow:0 5px 18px #00000008;
}

h2{
  font-size:17px;
  margin:0 0 14px;
}

.field{
  margin:14px 0;
}

.field label{
  display:flex;
  justify-content:space-between;
  font-weight:650;
  font-size:14px;
  margin-bottom:7px;
}

input[type=range]{
  width:100%;
  accent-color:var(--accent);
}

select,
input[type=number]{
  width:100%;
  padding:10px;
  border:1px solid var(--line);
  border-radius:10px;
  background:white;
  font-size:15px;
}

.drop{
  border:2px dashed #cfc6b7;
  border-radius:14px;
  padding:22px;
  text-align:center;
  color:var(--muted);
  cursor:pointer;
  background:#fff;
}

.drop:hover{
  border-color:var(--accent);
}

.drop strong{
  display:block;
  color:var(--ink);
  margin-bottom:4px;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  font-weight:700;
  cursor:pointer;
  background:var(--accent);
  color:white;
}

button.secondary{
  background:#e9e2d7;
  color:var(--ink);
}

.buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:16px;
}

.preview{
  min-height:600px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  overflow:auto;
}

#gridWrap{
  max-width:100%;
  overflow:auto;
  padding:10px;
}

#grid{
  display:grid;
  border:1px solid #777;
  background:#fff;
  line-height:0;
  box-shadow:0 3px 12px #0001;
}

.cell{
  aspect-ratio:1;
  border-right:1px solid #0003;
  border-bottom:1px solid #0003;
}

.meta{
  width:100%;
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:5px;
  color:var(--muted);
  font-size:13px;
}

.legend{
  width:100%;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:16px;
  padding-top:14px;
  border-top:1px solid var(--line);
}

.swatch{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:13px;
}

.dot{
  width:20px;
  height:20px;
  border:1px solid #999;
  border-radius:4px;
}

.empty{
  padding:100px 20px;
  text-align:center;
  color:var(--muted);
}

.small{
  font-size:12px;
  color:var(--muted);
  line-height:1.45;
}

@media(max-width:850px){
  .layout{
    grid-template-columns:1fr;
  }

  .preview{
    min-height:400px;
  }
}

@media print{
  body{
    background:white;
  }

  .controls{
    display:none!important;
  }

  .layout{
    display:block;
  }

  .card{
    border:0;
    box-shadow:none;
  }

  .preview{
    display:block;
  }

  .wrap{
    padding:0;
  }

  header{
    display:none;
  }
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <h1>Pixelarte</h1>
  <p>Transforme imagens em gráficos para crochê e macramê.</p>
</header>

<div class="layout">

<section class="card controls">

  <h2>1. Sua imagem</h2>

  <label class="drop" for="file">
    <strong>Escolher imagem</strong>
    <span>JPG, PNG ou WEBP</span>
  </label>

  <input
    id="file"
    type="file"
    accept="image/*"
    hidden
  >

  <h2 style="margin-top:24px">
    2. Configuração
  </h2>

  <div class="field">
    <label>
      Colunas
      <span id="colsVal">40</span>
    </label>

    <input
      id="cols"
      type="range"
      min="5"
      max="100"
      value="40"
    >
  </div>

  <div class="field">
    <label>
      Linhas
      <span id="rowsVal">40</span>
    </label>

    <input
      id="rows"
      type="range"
      min="5"
      max="100"
      value="40"
    >
  </div>

  <div class="field">
    <label>
      Número de cores
      <span id="colorsVal">8</span>
    </label>

    <input
      id="colors"
      type="range"
      min="2"
      max="20"
      value="8"
    >
  </div>

  <div class="field">
    <label>Paleta</label>

    <select id="palette">
      <option value="image">
        Adaptada à imagem
      </option>

      <option value="gray">
        Preto e branco
      </option>

      <option value="earth">
        Terra / natural
      </option>

      <option value="classic">
        Clássica
      </option>
    </select>
  </div>

  <div class="field">
    <label>Modo</label>

    <select id="mode">
      <option>Crochê</option>
      <option>Macramê</option>
    </select>
  </div>

  <div class="buttons">
    <button id="generate">
      Gerar gráfico
    </button>

    <button
      class="secondary"
      id="download"
      disabled
    >
      Baixar PNG
    </button>

    <button
      class="secondary"
      id="print"
      disabled
    >
      Imprimir / PDF
    </button>
  </div>

  <p
    class="small"
    style="margin-top:15px"
  >
    Dica: para peças executáveis, comece com
    20–50 colunas e 4–12 cores.
    Quanto maior a grade, mais detalhes aparecem.
  </p>

</section>

<section class="card preview">

  <div
    id="empty"
    class="empty"
  >
    <strong>
      Seu gráfico aparecerá aqui.
    </strong>
    <br>
    Escolha uma imagem e clique em “Gerar gráfico”.
  </div>

  <div
    id="result"
    style="display:none;width:100%"
  >

    <div class="meta">
      <span id="sizeText"></span>
      <span id="modeText"></span>
    </div>

    <div id="gridWrap">
      <div id="grid"></div>
    </div>

    <div
      id="legend"
      class="legend"
    ></div>

  </div>

</section>

</div>
</div>

<script>

const $ = id =>
  document.getElementById(id);

let sourceImg = null;
let paletteColors = [];
let lastCanvas = null;

const palettes = {

  gray:[
    "#111111",
    "#333333",
    "#555555",
    "#777777",
    "#999999",
    "#bbbbbb",
    "#dddddd",
    "#f5f5f5"
  ],

  earth:[
    "#2d241e",
    "#5a4030",
    "#815b3e",
    "#a8794f",
    "#c5a47e",
    "#dfcfb5",
    "#efe5d3",
    "#faf7ef",
    "#6d4c41",
    "#9a6b4f",
    "#b88a62",
    "#3f5140"
  ],

  classic:[
    "#111111",
    "#ffffff",
    "#c62828",
    "#e53935",
    "#f6c945",
    "#2e7d32",
    "#1976d2",
    "#7b1fa2",
    "#f57c00",
    "#795548",
    "#00897b",
    "#6d4c41",
    "#c2185b",
    "#90a4ae",
    "#424242"
  ]

};

$("file").addEventListener(
  "change",
  e => {

    const f = e.target.files[0];

    if(!f){
      return;
    }

    const url =
      URL.createObjectURL(f);

    sourceImg =
      new Image();

    sourceImg.onload = () => {

      $("empty").innerHTML =
        "<strong>Imagem carregada.</strong><br>" +
        "Clique em “Gerar gráfico”.";

    };

    sourceImg.src =
      url;

  }
);

[
  "cols",
  "rows",
  "colors"
].forEach(id =>

  $(id).addEventListener(
    "input",
    () => {

      $(`${id}Val`).textContent =
        $(id).value;

    }
  )

);

$("generate").addEventListener(
  "click",
  generate
);

$("download").addEventListener(
  "click",
  downloadPNG
);

$("print").addEventListener(
  "click",
  () => window.print()
);

function rgb(hex){

  return [
    parseInt(
      hex.slice(1,3),
      16
    ),

    parseInt(
      hex.slice(3,5),
      16
    ),

    parseInt(
      hex.slice(5,7),
      16
    )
  ];

}

function dist(a,b){

  return (
    (a[0]-b[0]) ** 2 +
    (a[1]-b[1]) ** 2 +
    (a[2]-b[2]) ** 2
  );

}

function nearest(c,pal){

  let best = 0;
  let d = 1e20;

  for(
    let i = 0;
    i < pal.length;
    i++
  ){

    let x =
      dist(
        c,
        rgb(pal[i])
      );

    if(x < d){

      d = x;
      best = i;

    }

  }

  return best;

}

function makePalette(
  pixels,
  n
){

  if(
    $("palette").value
    !==
    "image"
  ){

    const p =
      palettes[
        $("palette").value
      ];

    return p.slice(
      0,
      Math.min(
        n,
        p.length
      )
    );

  }

  /*
    K-means simples e determinístico
    para gerar paleta baseada
    nas cores da imagem.
  */

  let seeds = [];

  for(
    let i = 0;
    i < n;
    i++
  ){

    seeds.push(

      pixels[
        Math.floor(
          i *
          (pixels.length - 1)
          /
          Math.max(
            1,
            n - 1
          )
        )
      ].slice()

    );

  }

  for(
    let iter = 0;
    iter < 7;
    iter++
  ){

    const sums =
      Array.from(
        {
          length:n
        },
        () =>
          [0,0,0,0]
      );

    for(
      const c
      of pixels
    ){

      let k =
        nearest(
          c,
          seeds
        );

      sums[k][0] += c[0];
      sums[k][1] += c[1];
      sums[k][2] += c[2];
      sums[k][3]++;

    }

    for(
      let k = 0;
      k < n;
      k++
    ){

      if(
        sums[k][3]
      ){

        seeds[k] =
          sums[k]
          .slice(
            0,
            3
          )
          .map(
            v =>
              Math.round(
                v /
                sums[k][3]
              )
          );

      }

    }

  }

  return seeds.map(

    c =>
      "#" +
      c.map(
        v =>
          v
          .toString(16)
          .padStart(
            2,
            "0"
          )
      )
      .join("")

  );

}

function generate(){

  if(
    !sourceImg
  ){

    alert(
      "Escolha uma imagem primeiro."
    );

    return;

  }

  const cols =
    +$("cols").value;

  const rows =
    +$("rows").value;

  const n =
    +$("colors").value;

  const c =
    document.createElement(
      "canvas"
    );

  const ctx =
    c.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );

  c.width =
    cols;

  c.height =
    rows;

  /*
    Preenche toda a grade
    preservando proporção
    da imagem.
  */

  const scale =
    Math.max(

      cols /
      sourceImg.naturalWidth,

      rows /
      sourceImg.naturalHeight

    );

  const w =
    sourceImg.naturalWidth
    *
    scale;

  const h =
    sourceImg.naturalHeight
    *
    scale;

  ctx.fillStyle =
    "#fff";

  ctx.fillRect(
    0,
    0,
    cols,
    rows
  );

  ctx.drawImage(
    sourceImg,
    (cols-w)/2,
    (rows-h)/2,
    w,
    h
  );

  const data =
    ctx
    .getImageData(
      0,
      0,
      cols,
      rows
    )
    .data;

  const pixels = [];

  for(
    let i = 0;
    i < data.length;
    i += 4
  ){

    pixels.push(
      [
        data[i],
        data[i+1],
        data[i+2]
      ]
    );

  }

  paletteColors =
    makePalette(
      pixels,
      n
    );

  const counts =
    Array(
      paletteColors.length
    )
    .fill(0);

  const grid =
    $("grid");

  grid.innerHTML =
    "";

  grid.style.gridTemplateColumns =
    `repeat(${cols},minmax(5px,1fr))`;

  /*
    Criar os pixels
    visuais do gráfico.
  */

  for(
    let i = 0;
    i < pixels.length;
    i++
  ){

    const k =
      nearest(
        pixels[i],
        paletteColors
      );

    counts[k]++;

    const cell =
      document.createElement(
        "div"
      );

    cell.className =
      "cell";

    cell.style.background =
      paletteColors[k];

    grid.appendChild(
      cell
    );

  }

  $("sizeText").textContent =
    `${cols} × ${rows} pontos • ` +
    `${counts.reduce(
      (a,b) => a+b,
      0
    )} pontos`;

  $("modeText").textContent =
    $("mode").value;

  const legend =
    $("legend");

  legend.innerHTML =
    "";

  paletteColors.forEach(
    (
      col,
      i
    ) => {

      if(
        !counts[i]
      ){
        return;
      }

      const s =
        document.createElement(
          "div"
        );

      s.className =
        "swatch";

      const d =
        document.createElement(
          "span"
        );

      d.className =
        "dot";

      d.style.background =
        col;

      s.append(
        d,
        document.createTextNode(
          `${
            String.fromCharCode(
              65+i
            )
          } — ${counts[i]} pontos`
        )
      );

      legend.appendChild(
        s
      );

    }
  );

  $("empty").style.display =
    "none";

  $("result").style.display =
    "block";

  $("download").disabled =
    false;

  $("print").disabled =
    false;

  /*
    Render de alta resolução
    para salvar PNG.
  */

  lastCanvas =
    document.createElement(
      "canvas"
    );

  const cell =
    Math.max(
      12,
      Math.floor(
        1200 /
        cols
      )
    );

  lastCanvas.width =
    cols * cell;

  lastCanvas.height =
    rows * cell;

  const lc =
    lastCanvas.getContext(
      "2d"
    );

  lc.imageSmoothingEnabled =
    false;

  for(
    let y = 0;
    y < rows;
    y++
  ){

    for(
      let x = 0;
      x < cols;
      x++
    ){

      const k =
        nearest(
          pixels[
            y * cols + x
          ],
          paletteColors
        );

      lc.fillStyle =
        paletteColors[k];

      lc.fillRect(
        x * cell,
        y * cell,
        cell,
        cell
      );

      lc.strokeStyle =
        "rgba(0,0,0,.22)";

      lc.strokeRect(
        x * cell + .5,
        y * cell + .5,
        cell - 1,
        cell - 1
      );

    }

  }

}

function downloadPNG(){

  if(
    !lastCanvas
  ){
    return;
  }

  const a =
    document.createElement(
      "a"
    );

  a.download =
    "grafico-croche-macrame.png";

  a.href =
    lastCanvas.toDataURL(
      "image/png"
    );

  a.click();

}

</script>

</body>
</html>
